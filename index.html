<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizarra de Casa</title>
<meta name="theme-color" content="#edf1f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Pizarra limpia y clara: hora grande a la izquierda, clima a la derecha, tres columnas de notas abajo. Si en la carpeta hay un fondo.jpg, se usa de fondo con paneles translúcidos. */
:root{
  --bg:#edf1f0;
  --surface:#ffffff;
  --glass:rgba(255,255,255,.78);
  --line:#d3dcda;
  --fg:#1c2828;
  --muted:#5d6c6a;
  --mechi:#d45f57;
  --lucas:#3a7fbd;
  --casa:#b58c1f;
  --danger:#c94b3c;
  --f-num:"Sora", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  min-height:100%;
  padding-left:max(24px, env(safe-area-inset-left, 0px));
  padding-right:max(24px, env(safe-area-inset-right, 0px));
  padding-block:max(28px, env(safe-area-inset-top, 0px)) 32px;
  display:flex;flex-direction:column;gap:clamp(24px,4vh,48px);
  max-width:1800px;margin:0 auto;
}

/* Cabecera */
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 48px}
.clock{font-family:var(--f-num);font-weight:200;font-size:clamp(4rem,11vw,10rem);line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.date{margin-top:14px;font-size:clamp(1.15rem,2vw,1.7rem);color:var(--muted)}
.date b{color:var(--fg);font-weight:500}

.weather{display:flex;align-items:center;gap:clamp(14px,2vw,28px)}
.wnow{display:flex;align-items:center;gap:14px}
.wicon{width:clamp(48px,6vw,84px);height:clamp(48px,6vw,84px);color:var(--fg)}
.wtemp{font-family:var(--f-num);font-weight:300;font-size:clamp(2.6rem,5vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.wdesc{color:var(--muted);font-size:clamp(.95rem,1.4vw,1.2rem);margin-top:4px}
.wdays{display:flex;gap:clamp(12px,1.6vw,24px);padding-left:clamp(14px,2vw,28px);border-left:1px solid var(--line)}
.wday{display:grid;justify-items:center;gap:4px;font-size:clamp(.85rem,1.2vw,1.05rem);font-variant-numeric:tabular-nums}
.wday svg{width:30px;height:30px}
.wday .d{color:var(--muted);text-transform:capitalize}
.wday .t span{color:var(--muted)}
.wday .p{color:var(--lucas);font-size:.85em;min-height:1.2em}

/* Notas */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);flex:1;align-content:start}
.col{min-width:0;display:flex;flex-direction:column;gap:14px}
.col h2{
  margin:0;display:flex;align-items:center;gap:10px;
  font-size:clamp(.85rem,1.1vw,1rem);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  padding-bottom:12px;border-bottom:1px solid var(--line);
}
.col h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.note{display:flex;align-items:flex-start;gap:12px;padding:10px 0}
.note .txt{flex:1;min-width:0;font-size:clamp(1.25rem,1.9vw,1.75rem);line-height:1.3;font-weight:500;overflow-wrap:anywhere}
.when{display:block;font-size:clamp(.8rem,1vw,.95rem);font-weight:600;color:var(--c);margin-bottom:2px;letter-spacing:.02em}
.when.today{color:var(--fg)}
.when.today::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-left:8px;vertical-align:middle}
.empty{color:var(--muted);font-size:1.05rem;padding:10px 0}
.x{flex:none;font:inherit;font-size:.85rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.x.armed{background:var(--danger);border-color:var(--danger);color:var(--bg);font-weight:600}
body.tv .x{display:none}

/* Formulario (celular) */
.addbar{display:flex;justify-content:flex-end}
.btn{font:inherit;font-weight:600;font-size:1rem;color:var(--bg);background:var(--fg);border:0;border-radius:999px;padding:12px 22px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.6}
form{display:grid;gap:16px;background:var(--surface);border-radius:16px;padding:18px}
.field{display:grid;gap:8px;min-width:0}
label,.lbl{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date]{font:inherit;font-size:1.1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.who{display:flex;flex-wrap:wrap;gap:8px}
.who button{font:inherit;font-weight:600;cursor:pointer;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:9px 16px;display:flex;align-items:center;gap:8px}
.who button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.who button[aria-pressed=true]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.row .field{flex:1 1 170px}
.msg{margin:0;min-height:1.2em;color:var(--muted);font-size:.95rem}
.msg.err{color:var(--danger)}
.status{margin:0;color:var(--muted)}
.btn:focus-visible,.x:focus-visible,.who button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:3px}


/* Foto de fondo (fondo.jpg en el repositorio) */
#fondo{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;display:none}
body.foto #fondo{display:block}
body.foto header,body.foto .col,body.foto .status{
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-radius:20px;padding:20px 24px;
}
body.foto .col h2{border-bottom-color:rgba(28,40,40,.12)}
@media (max-width:760px){
  .cols{grid-template-columns:1fr}
  .wdays{display:none}
  .wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
}
</style>
</head>
<body>
<div id="fondo" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="weather" id="weather" hidden>
      <div class="wnow">
        <svg class="wicon" id="wicon" viewBox="0 0 48 48" aria-hidden="true"></svg>
        <div>
          <div class="wtemp" id="wtemp"></div>
          <div class="wdesc" id="wdesc"></div>
        </div>
      </div>
      <div class="wdays" id="wdays"></div>
    </div>
  </header>

  <div class="addbar" id="addbar"><button class="btn" id="abrir" type="button">+ Anotar</button></div>

  <form id="form" hidden>
    <div class="field">
      <label for="texto">Nota</label>
      <input type="text" id="texto" maxlength="120" placeholder="Ej: turno veterinario de Lima 18 h" autocomplete="off">
    </div>
    <div class="row">
      <div class="field">
        <span class="lbl" id="quienLbl">Para quién</span>
        <div class="who" role="group" aria-labelledby="quienLbl">
          <button type="button" data-q="mechi" style="--c:var(--mechi)" aria-pressed="true">Mechi</button>
          <button type="button" data-q="lucas" style="--c:var(--lucas)" aria-pressed="false">Lucas</button>
          <button type="button" data-q="casa" style="--c:var(--casa)" aria-pressed="false">Casa</button>
        </div>
      </div>
      <div class="field">
        <label for="cuando">Día (opcional)</label>
        <input type="date" id="cuando">
      </div>
    </div>
    <div class="row">
      <button class="btn" type="submit" id="guardar">Guardar</button>
      <button class="btn ghost" type="button" id="cerrar">Cerrar</button>
    </div>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>

  <p class="status" id="status" aria-live="polite">Cargando notas…</p>

  <section class="cols">
    <div class="col" style="--c:var(--mechi)"><h2>Mechi</h2><ul class="notes" id="list-mechi"></ul></div>
    <div class="col" style="--c:var(--lucas)"><h2>Lucas</h2><ul class="notes" id="list-lucas"></ul></div>
    <div class="col" style="--c:var(--casa)"><h2>Casa</h2><ul class="notes" id="list-casa"></ul></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== CONFIGURACIÓN DE FIREBASE (pegar acá) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBAlB2HiuZqZQQt0JwpJLmwoykw5k3XOuc",
  authDomain: "pizarra-casa.firebaseapp.com",
  databaseURL: "https://pizarra-casa-default-rtdb.firebaseio.com",
  projectId: "pizarra-casa",
  storageBucket: "pizarra-casa.firebasestorage.app",
  messagingSenderId: "516665870140",
  appId: "1:516665870140:web:581e8c2dbed71faf6ec039"
};
/* ================================================== */

(function(){
  const TZ = "America/Argentina/Buenos_Aires";
  const LAT = -34.61, LON = -58.38; // Buenos Aires
  const $ = id => document.getElementById(id);
  const QUIENES = ["mechi","lucas","casa"];
  const VACIO = {mechi:"Sin notas", lucas:"Sin notas", casa:"Sin pendientes"};

  /* Modo tele: pantallas anchas o ?tv en el link */
  const esTV = /[?&]tv\b/.test(location.search) || (window.innerWidth >= 1200 && !('ontouchstart' in window));
  if (esTV) document.body.classList.add("tv");

  /* ---------- Fechas ---------- */
  function hoyISO(){
    const p = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
    return p; // YYYY-MM-DD
  }
  const diaUTC = iso => { const [y,m,d] = iso.split("-").map(Number); return Date.UTC(y,m-1,d); };
  function etiqueta(iso){
    const dif = Math.round((diaUTC(iso) - diaUTC(hoyISO()))/86400000);
    if (dif === 0) return {t:"Hoy", hoy:true};
    if (dif === 1) return {t:"Mañana"};
    const dt = new Date(diaUTC(iso) + 12*3600000);
    if (dif > 1 && dif < 7){ const w = dt.toLocaleDateString("es-AR",{timeZone:"UTC",weekday:"long"}); return {t:w.charAt(0).toUpperCase()+w.slice(1)}; }
    return {t: dt.toLocaleDateString("es-AR",{timeZone:"UTC",weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"")};
  }

  let ultimoDia = null;
  function tick(){
    const now = new Date();
    $("clock").textContent = now.toLocaleTimeString("es-AR",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false});
    const wd = now.toLocaleDateString("es-AR",{timeZone:TZ,weekday:"long"});
    const dm = now.toLocaleDateString("es-AR",{timeZone:TZ,day:"numeric",month:"long"});
    $("date").innerHTML = "";
    const b = document.createElement("b"); b.textContent = wd.charAt(0).toUpperCase()+wd.slice(1);
    $("date").append(b, document.createTextNode(" " + dm));
    if (ultimoDia !== hoyISO()){ ultimoDia = hoyISO(); render(); }
  }

  /* Pantalla siempre encendida si el navegador lo permite */
  async function wake(){ try{ if (navigator.wakeLock) await navigator.wakeLock.request("screen"); }catch(e){} }
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") wake(); });
  wake();

  /* Foto de fondo opcional */
  (function(){
    const img = new Image();
    img.onload = ()=>{ $("fondo").style.backgroundImage = "url(fondo.jpg?v=" + Date.now().toString().slice(0,-7) + ")"; document.body.classList.add("foto"); };
    img.src = "fondo.jpg?v=" + Date.now().toString().slice(0,-7);
  })();

  /* ---------- Clima (Open-Meteo, sin clave) ---------- */
  const ICON = {
    sol:'<circle cx="24" cy="24" r="8" fill="none" stroke="currentColor" stroke-width="2.5"/><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/></g>',
    parcial:'<circle cx="18" cy="18" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M18 6v3M6 18h3M9.5 9.5l2 2M26.5 9.5l-2 2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M17 38h18a7 7 0 0 0 0-14 9 9 0 0 0-17 3 5.5 5.5 0 0 0-1 11z" fill="var(--bg)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>',
    nube:'<path d="M14 36h20a8 8 0 0 0 0-16 10 10 0 0 0-19 3 6.5 6.5 0 0 0-1 13z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>',
    niebla:'<g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M10 18h28M6 25h36M10 32h28"/></g>',
    lluvia:'<path d="M14 28h20a8 8 0 0 0 0-16 10 10 0 0 0-19 3 6.5 6.5 0 0 0-1 13z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M17 33l-2 6M25 33l-2 6M33 33l-2 6"/></g>',
    tormenta:'<path d="M14 26h20a8 8 0 0 0 0-16 10 10 0 0 0-19 3 6.5 6.5 0 0 0-1 13z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M25 28l-5 8h6l-4 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>',
    nieve:'<path d="M14 28h20a8 8 0 0 0 0-16 10 10 0 0 0-19 3 6.5 6.5 0 0 0-1 13z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><g fill="currentColor"><circle cx="17" cy="36" r="2"/><circle cx="25" cy="39" r="2"/><circle cx="33" cy="36" r="2"/></g>'
  };
  function clima(code){
    if (code===0) return ["sol","Despejado"];
    if (code===1) return ["sol","Mayormente despejado"];
    if (code===2) return ["parcial","Parcialmente nublado"];
    if (code===3) return ["nube","Nublado"];
    if (code===45||code===48) return ["niebla","Niebla"];
    if (code>=51&&code<=57) return ["lluvia","Llovizna"];
    if ((code>=61&&code<=67)||(code>=80&&code<=82)) return ["lluvia","Lluvia"];
    if ((code>=71&&code<=77)||code===85||code===86) return ["nieve","Nieve"];
    if (code>=95) return ["tormenta","Tormenta"];
    return ["nube",""];
  }
  async function cargarClima(){
    try{
      const url = "https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+
        "&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
        "&timezone="+encodeURIComponent(TZ)+"&forecast_days=4";
      const r = await fetch(url); if (!r.ok) throw 0;
      const j = await r.json();
      const [ic, desc] = clima(j.current.weather_code);
      $("wicon").innerHTML = ICON[ic];
      $("wtemp").textContent = Math.round(j.current.temperature_2m) + "°";
      $("wdesc").textContent = desc + " · " + Math.round(j.daily.temperature_2m_max[0]) + "° / " + Math.round(j.daily.temperature_2m_min[0]) + "°";
      const cont = $("wdays"); cont.innerHTML = "";
      for (let i=1;i<4;i++){
        const iso = j.daily.time[i];
        const dt = new Date(diaUTC(iso)+12*3600000);
        const el = document.createElement("div"); el.className="wday";
        const d = document.createElement("div"); d.className="d"; d.textContent = dt.toLocaleDateString("es-AR",{timeZone:"UTC",weekday:"short"}).replace(".","");
        const svg = document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.setAttribute("viewBox","0 0 48 48"); svg.innerHTML = ICON[clima(j.daily.weather_code[i])[0]];
        const t = document.createElement("div"); t.className="t"; t.innerHTML = Math.round(j.daily.temperature_2m_max[i])+"° <span>"+Math.round(j.daily.temperature_2m_min[i])+"°</span>";
        const p = document.createElement("div"); p.className="p"; const pp = j.daily.precipitation_probability_max[i]; p.textContent = pp>=30 ? pp+"% lluvia" : "";
        el.append(d, svg, t, p); cont.appendChild(el);
      }
      $("weather").hidden = false;
    }catch(e){ /* sin clima: la pizarra sigue funcionando */ }
  }
  cargarClima(); setInterval(cargarClima, 30*60*1000);

  /* ---------- Formulario ---------- */
  let quien = "mechi";
  document.querySelectorAll(".who button").forEach(b=>b.addEventListener("click",()=>{
    quien = b.dataset.q;
    document.querySelectorAll(".who button").forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
  }));
  function abrir(){ $("form").hidden=false; $("addbar").hidden=true; }
  function cerrar(){ $("form").hidden=true; $("addbar").hidden=false; $("msg").textContent=""; }
  $("abrir").addEventListener("click", ()=>{ abrir(); $("texto").focus(); });
  $("cerrar").addEventListener("click", cerrar);
  if (esTV) $("addbar").hidden = true;
  else if (window.matchMedia("(max-width:760px)").matches) abrir();

  function aviso(t, err){ $("msg").textContent = t; $("msg").classList.toggle("err", !!err); }

  /* ---------- Notas ---------- */
  let notas = [], ref = null;

  function render(){
    const h = hoyISO();
    QUIENES.forEach(q=>{
      const ul = $("list-"+q); ul.textContent = "";
      const items = notas.filter(n=>n.quien===q && (!n.cuando || n.cuando >= h)).sort((a,b)=>{
        const ca=a.cuando||"9999", cb=b.cuando||"9999";
        return ca!==cb ? (ca<cb?-1:1) : (a.creada||0)-(b.creada||0);
      });
      if (!items.length){ const li=document.createElement("li"); li.className="empty"; li.textContent=VACIO[q]; ul.appendChild(li); return; }
      items.forEach(n=>{
        const li = document.createElement("li"); li.className="note";
        const txt = document.createElement("div"); txt.className="txt";
        if (n.cuando){ const e=etiqueta(n.cuando); const s=document.createElement("span"); s.className="when"+(e.hoy?" today":""); s.textContent=e.t; txt.appendChild(s); }
        txt.appendChild(document.createTextNode(n.texto));
        li.appendChild(txt);
        if (ref){
          const x=document.createElement("button"); x.type="button"; x.className="x"; x.textContent="Borrar";
          x.setAttribute("aria-label","Borrar: "+n.texto);
          let t=null;
          x.addEventListener("click", async ()=>{
            if (!x.classList.contains("armed")){ x.classList.add("armed"); x.textContent="¿Seguro?"; t=setTimeout(()=>{x.classList.remove("armed"); x.textContent="Borrar";},4000); return; }
            clearTimeout(t); x.disabled=true;
            try{ await ref.child(n.id).remove(); }catch(e){ x.disabled=false; x.classList.remove("armed"); x.textContent="Borrar"; $("status").hidden=false; $("status").textContent="No se pudo borrar. Probá de nuevo."; }
          });
          li.appendChild(x);
        }
        ul.appendChild(li);
      });
    });
  }

  $("form").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const texto = $("texto").value.trim();
    if (!texto){ aviso("Escribí qué querés anotar.", true); $("texto").focus(); return; }
    if (!ref){ aviso("La pizarra todavía no está conectada.", true); return; }
    $("guardar").disabled = true;
    try{
      await ref.push({texto, quien, cuando:$("cuando").value||"", creada:Date.now()});
      $("texto").value=""; $("cuando").value=""; aviso("Anotado.");
      setTimeout(()=>aviso(""), 2500);
    }catch(e){ aviso("No se pudo guardar. Revisá la conexión y probá de nuevo.", true); }
    finally{ $("guardar").disabled = false; }
  });

  tick(); setInterval(tick, 1000);

  if (!firebaseConfig || typeof firebase === "undefined"){
    $("status").textContent = "Vista de ejemplo: falta conectar la base de datos.";
    notas = [
      {id:"a", quien:"mechi", texto:"Ejemplo: llamar al salón", cuando:hoyISO(), creada:1},
      {id:"b", quien:"lucas", texto:"Ejemplo: partido de fútbol 20 h", cuando:"", creada:2},
      {id:"c", quien:"casa", texto:"Ejemplo: comprar comida de Lima", cuando:"", creada:3}
    ];
    render();
    return;
  }

  firebase.initializeApp(firebaseConfig);
  ref = firebase.database().ref("pizarra/notas");
  const timer = setTimeout(()=>{ $("status").hidden=false; $("status").textContent="No pude conectar con la pizarra. Revisá el wifi."; }, 10000);
  ref.on("value", snap=>{
    clearTimeout(timer);
    const v = snap.val() || {};
    notas = Object.keys(v).map(k=>Object.assign({id:k}, v[k]));
    $("status").hidden = true;
    render();
  }, ()=>{
    clearTimeout(timer);
    $("status").hidden=false; $("status").textContent="La base de datos no dejó leer las notas. Revisá las reglas en Firebase.";
  });
  setInterval(()=>location.reload(), 6*60*60*1000); // refresco cada 6 h por si la tele queda prendida días
})();
</script>
</body>
</html>
